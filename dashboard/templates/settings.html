{% extends "base.html" %}
{% block title %}Settings{% endblock %}

{% block content %}
<h1>⚙️ Settings</h1>

{% if saved %}
<div class="card" style="background:var(--success-bg);border-color:var(--success)">
  ✅ Configuration saved successfully. Restart pipeline to apply changes.
</div>
{% endif %}

<form method="post" action="/settings">
  <!-- Gemini Section -->
  <div class="card">
    <div class="card-title mb-1"><i data-lucide="sparkles" style="width:16px;height:16px"></i> Gemini Settings</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
      <div>
        <label class="text-muted" style="font-size:12px;display:block;margin-bottom:4px">Quick Search Model</label>
        <input class="form-input" name="GEMINI_QUICK_MODEL" value="{{ cfg.GEMINI_QUICK_MODEL }}">
      </div>
      <div>
        <label class="text-muted" style="font-size:12px;display:block;margin-bottom:4px">Daily Limit</label>
        <input class="form-input" name="GEMINI_DAILY_LIMIT" value="{{ cfg.GEMINI_DAILY_LIMIT }}" type="number">
      </div>
      <div>
        <label class="text-muted" style="font-size:12px;display:block;margin-bottom:4px">Confidence Threshold</label>
        <input class="form-input" name="GEMINI_CONFIDENCE_THRESHOLD" value="{{ cfg.GEMINI_CONFIDENCE_THRESHOLD }}" type="number" step="0.05">
      </div>
      <div>
        <label class="text-muted" style="font-size:12px;display:block;margin-bottom:4px">Quick Search Enabled</label>
        <select class="form-select" name="GEMINI_QUICK_ENABLED">
          <option value="True" {{ 'selected' if cfg.GEMINI_QUICK_ENABLED }}>On</option>
          <option value="False" {{ 'selected' if not cfg.GEMINI_QUICK_ENABLED }}>Off</option>
        </select>
      </div>
    </div>
  </div>

  <!-- Serper Section -->
  <div class="card">
    <div class="card-title mb-1"><i data-lucide="search" style="width:16px;height:16px"></i> Serper Settings</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
      <div>
        <label class="text-muted" style="font-size:12px;display:block;margin-bottom:4px">Serper Enabled</label>
        <select class="form-select" name="SERPER_ENABLED">
          <option value="True" {{ 'selected' if cfg.SERPER_ENABLED }}>On</option>
          <option value="False" {{ 'selected' if not cfg.SERPER_ENABLED }}>Off</option>
        </select>
      </div>
      <div>
        <label class="text-muted" style="font-size:12px;display:block;margin-bottom:4px">Serper Num Results</label>
        <input class="form-input" name="SERPER_NUM_RESULTS" value="{{ cfg.SERPER_NUM_RESULTS }}" type="number">
      </div>
    </div>
  </div>

  <!-- Feature Toggles -->
  <div class="card">
    <div class="card-title mb-1"><i data-lucide="toggle-right" style="width:16px;height:16px"></i> Feature Toggles</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
      <div>
        <label class="text-muted" style="font-size:12px;display:block;margin-bottom:4px">Scrape LinkedIn</label>
        <select class="form-select" name="SCRAPE_LINKEDIN_ENABLED">
          <option value="True" {{ 'selected' if cfg.SCRAPE_LINKEDIN_ENABLED }}>On</option>
          <option value="False" {{ 'selected' if not cfg.SCRAPE_LINKEDIN_ENABLED }}>Off</option>
        </select>
      </div>
      <div>
        <label class="text-muted" style="font-size:12px;display:block;margin-bottom:4px">Scrape Masothue</label>
        <select class="form-select" name="SCRAPE_MASOTHUE_ENABLED">
          <option value="True" {{ 'selected' if cfg.SCRAPE_MASOTHUE_ENABLED }}>On</option>
          <option value="False" {{ 'selected' if not cfg.SCRAPE_MASOTHUE_ENABLED }}>Off</option>
        </select>
      </div>
    </div>
  </div>

  <!-- Pipeline Settings -->
  <div class="card">
    <div class="card-title mb-1"><i data-lucide="sliders-horizontal" style="width:16px;height:16px"></i> Pipeline Settings</div>
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px">
      <div>
        <label class="text-muted" style="font-size:12px;display:block;margin-bottom:4px">Delay (seconds)</label>
        <input class="form-input" name="DELAY_SECONDS" value="{{ cfg.DELAY_SECONDS }}" type="number" step="0.5">
      </div>
      <div>
        <label class="text-muted" style="font-size:12px;display:block;margin-bottom:4px">Max Retries</label>
        <input class="form-input" name="MAX_RETRIES" value="{{ cfg.MAX_RETRIES }}" type="number">
      </div>
      <div>
        <label class="text-muted" style="font-size:12px;display:block;margin-bottom:4px">Batch Size</label>
        <input class="form-input" name="BATCH_SIZE" value="{{ cfg.BATCH_SIZE }}" type="number">
      </div>
      <div>
        <label class="text-muted" style="font-size:12px;display:block;margin-bottom:4px">Search Limit</label>
        <input class="form-input" name="SEARCH_LIMIT" value="{{ cfg.SEARCH_LIMIT }}" type="number">
      </div>
      <div>
        <label class="text-muted" style="font-size:12px;display:block;margin-bottom:4px">Top N Links</label>
        <input class="form-input" name="TOP_N" value="{{ cfg.TOP_N }}" type="number">
      </div>
      <div>
        <label class="text-muted" style="font-size:12px;display:block;margin-bottom:4px">Cache TTL (days)</label>
        <input class="form-input" name="CACHE_TTL_DAYS" value="{{ cfg.CACHE_TTL_DAYS }}" type="number">
      </div>
    </div>
  </div>

  <button type="submit" class="btn btn-success btn-lg">💾 Save Configuration</button>
</form>
{% endblock %}
