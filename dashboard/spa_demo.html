<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pipeline Control Center (Demo)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <style>
    /* =========================================================================
       CSS CUSTOM PROPERTIES (THEMES)
       ========================================================================= */
    :root {
      --font: 'Inter', -apple-system, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
      --radius: 12px;
      --radius-sm: 8px;
      --radius-xs: 6px;
      --transition: 0.2s ease;
    }

    [data-theme="glass-neon"] {
      --bg-primary: #09090b;
      --bg-secondary: rgba(24, 24, 27, 0.6);
      --bg-card: rgba(39, 39, 42, 0.4);
      --bg-input: rgba(0, 0, 0, 0.3);
      --border: rgba(168, 85, 247, 0.3);
      --border-focus: #a855f7;
      --accent: #a855f7;
      --accent-hover: #c084fc;
      --success: #10b981;
      --success-bg: rgba(16, 185, 129, 0.15);
      --warning: #f59e0b;
      --warning-bg: rgba(245, 158, 11, 0.15);
      --danger: #ef4444;
      --danger-bg: rgba(239, 68, 68, 0.15);
      --text: #e4e4e7;
      --text-muted: #a1a1aa;
      --text-heading: #fafafa;
      --shadow: 0 8px 32px rgba(168, 85, 247, 0.15);
      --shadow-sm: 0 4px 12px rgba(168, 85, 247, 0.1);
      --backdrop-blur: blur(20px);
      --nav-active: linear-gradient(90deg, rgba(168,85,247,0.15) 0%, transparent 100%);
      --nav-active-border: #a855f7;
      --gradient-brand: linear-gradient(135deg, #a855f7, #3b82f6);
    }

    [data-theme="github-dark"] {
      --bg-primary: #0d1117;
      --bg-secondary: #161b22;
      --bg-card: rgba(22, 27, 34, 0.75);
      --bg-input: #0d1117;
      --border: #30363d;
      --border-focus: #58a6ff;
      --accent: #58a6ff;
      --accent-hover: #79c0ff;
      --success: #3fb950;
      --success-bg: rgba(63, 185, 80, 0.1);
      --warning: #d29922;
      --warning-bg: rgba(210, 153, 34, 0.1);
      --danger: #f85149;
      --danger-bg: rgba(248, 81, 73, 0.1);
      --text: #c9d1d9;
      --text-muted: #8b949e;
      --text-heading: #f0f6fc;
      --shadow: 0 8px 24px rgba(0,0,0,0.3);
      --shadow-sm: 0 2px 8px rgba(0,0,0,0.2);
      --backdrop-blur: blur(12px);
      --nav-active: rgba(88, 166, 255, 0.08);
      --nav-active-border: #58a6ff;
      --gradient-brand: linear-gradient(135deg, #58a6ff, #a371f7);
    }

    [data-theme="light-minimal"] {
      --bg-primary: #f8fafc;
      --bg-secondary: #ffffff;
      --bg-card: #ffffff;
      --bg-input: #f1f5f9;
      --border: #e2e8f0;
      --border-focus: #3b82f6;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --success: #059669;
      --success-bg: rgba(5, 150, 105, 0.1);
      --warning: #d97706;
      --warning-bg: rgba(217, 119, 6, 0.1);
      --danger: #dc2626;
      --danger-bg: rgba(220, 38, 38, 0.1);
      --text: #334155;
      --text-muted: #64748b;
      --text-heading: #0f172a;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
      --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.05);
      --backdrop-blur: none;
      --nav-active: rgba(59, 130, 246, 0.08);
      --nav-active-border: #3b82f6;
      --gradient-brand: linear-gradient(135deg, #3b82f6, #06b6d4);
    }

    /* =========================================================================
       BASE & RESET
       ========================================================================= */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg-primary);
      color: var(--text);
      font-family: var(--font);
      font-size: 14px;
      line-height: 1.6;
      min-height: 100vh;
      overflow-x: hidden;
      transition: background 0.3s ease, color 0.3s ease;
    }
    
    /* Subtle background glow for Glass Neon */
    body[data-theme="glass-neon"]::before {
      content: '';
      position: fixed;
      top: -20%; left: -10%;
      width: 50%; height: 50%;
      background: radial-gradient(circle, rgba(168,85,247,0.08) 0%, transparent 60%);
      z-index: -1;
    }
    body[data-theme="glass-neon"]::after {
      content: '';
      position: fixed;
      bottom: -20%; right: -10%;
      width: 50%; height: 50%;
      background: radial-gradient(circle, rgba(59,130,246,0.08) 0%, transparent 60%);
      z-index: -1;
    }

    a { color: var(--accent); text-decoration: none; transition: color var(--transition); cursor: pointer; }
    a:hover { color: var(--accent-hover); }
    h1, h2, h3, h4 { color: var(--text-heading); font-weight: 600; }
    h1 { font-size: 24px; margin-bottom: 24px; letter-spacing: -0.5px; }
    h2 { font-size: 18px; margin-bottom: 16px; letter-spacing: -0.3px; }

    /* =========================================================================
       LAYOUT
       ========================================================================= */
    .app-layout { display: flex; min-height: 100vh; }
    
    .sidebar {
      width: 260px;
      background: var(--bg-secondary);
      backdrop-filter: var(--backdrop-blur);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      position: fixed;
      top: 0; left: 0; bottom: 0;
      z-index: 100;
      transition: all var(--transition);
    }

    .sidebar-brand {
      padding: 24px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }

    .logo-box {
      width: 36px; height: 36px;
      background: var(--gradient-brand);
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      box-shadow: var(--shadow-sm);
    }

    .brand-title { font-size: 16px; font-weight: 700; color: var(--text-heading); letter-spacing: -0.3px; }

    .sidebar-nav { flex: 1; padding: 16px 0; display: flex; flex-direction: column; gap: 4px; }
    
    .nav-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 24px;
      color: var(--text-muted);
      font-size: 14px;
      font-weight: 500;
      text-decoration: none;
      border-left: 3px solid transparent;
      transition: all var(--transition);
    }

    .nav-item:hover { color: var(--text); background: rgba(255,255,255,0.02); }
    .nav-item.active {
      color: var(--accent);
      background: var(--nav-active);
      border-left-color: var(--nav-active-border);
    }

    .nav-divider { height: 1px; background: var(--border); opacity: 0.5; margin: 12px 24px; }

    .sidebar-quota { padding: 24px; border-top: 1px solid rgba(255,255,255,0.05); }
    .quota-bar { margin-bottom: 16px; }
    .quota-label { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-muted); margin-bottom: 8px; font-weight: 500; }
    .quota-track { height: 6px; background: rgba(0,0,0,0.2); border-radius: 3px; overflow: hidden; box-shadow: inset 0 1px 2px rgba(0,0,0,0.1); }
    .quota-fill { height: 100%; border-radius: 3px; transition: width 1s cubic-bezier(0.4, 0, 0.2, 1); }
    .quota-fill.ok { background: var(--success); box-shadow: 0 0 8px rgba(16,185,129,0.4); }
    .quota-fill.warn { background: var(--warning); box-shadow: 0 0 8px rgba(245,158,11,0.4); }

    .main-content { margin-left: 260px; flex: 1; padding: 32px 40px; min-height: 100vh; position: relative; }
    .page-container { animation: fadeIn 0.3s ease forwards; }

    /* Theme Switcher */
    .theme-switcher { position: absolute; top: 32px; right: 40px; display: flex; gap: 8px; background: var(--bg-secondary); padding: 4px; border-radius: 20px; border: 1px solid var(--border); }
    .theme-btn { width: 28px; height: 28px; border-radius: 50%; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; background: transparent; color: var(--text-muted); transition: all var(--transition); }
    .theme-btn:hover { color: var(--text); background: rgba(255,255,255,0.05); }
    .theme-btn.active { color: var(--accent); background: var(--success-bg); }

    /* =========================================================================
       COMPONENTS
       ========================================================================= */
    .card {
      background: var(--bg-card);
      backdrop-filter: var(--backdrop-blur);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: var(--shadow-sm);
      transition: transform var(--transition), box-shadow var(--transition), border-color var(--transition);
    }
    
    [data-theme="glass-neon"] .card:hover { border-color: rgba(168,85,247,0.5); box-shadow: var(--shadow); }
    .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .card-title { font-size: 16px; font-weight: 600; color: var(--text-heading); display: flex; align-items: center; gap: 10px; }

    /* Stat Cards */
    .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; }
    .stat-card {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 20px;
      text-align: center;
      transition: all var(--transition);
      position: relative;
      overflow: hidden;
    }
    [data-theme="glass-neon"] .stat-card::after {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
      background: transparent; transition: background var(--transition);
    }
    [data-theme="glass-neon"] .stat-card:hover::after { background: var(--gradient-brand); }
    .stat-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-sm); border-color: var(--accent); }
    
    .stat-value { font-size: 32px; font-weight: 700; line-height: 1.2; letter-spacing: -1px; }
    .stat-label { font-size: 12px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-top: 8px; font-weight: 500; }

    /* Progress */
    .progress-wrapper { background: rgba(0,0,0,0.2); border-radius: 20px; height: 16px; overflow: hidden; position: relative; border: 1px solid rgba(255,255,255,0.05); }
    .progress-fill {
      height: 100%; border-radius: 20px;
      background: var(--gradient-brand);
      transition: width 1s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
    }
    .progress-fill::after {
      content: ''; position: absolute; top: 0; left: 0; bottom: 0; right: 0;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
      transform: translateX(-100%);
      animation: shimmer 2s infinite;
    }

    /* Badges */
    .badge { display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 20px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
    .badge-done { background: var(--success-bg); color: var(--success); border: 1px solid rgba(16,185,129,0.2); }
    .badge-failed { background: var(--danger-bg); color: var(--danger); border: 1px solid rgba(239,68,68,0.2); }
    .badge-pending { background: rgba(148,163,184,0.1); color: var(--text-muted); border: 1px solid rgba(148,163,184,0.2); }
    .badge-running { background: var(--warning-bg); color: var(--warning); border: 1px solid rgba(245,158,11,0.2); animation: pulse 2s infinite; }

    /* Tables */
    .table-container { overflow-x: auto; border-radius: var(--radius-sm); border: 1px solid var(--border); }
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th { background: var(--bg-secondary); padding: 14px 20px; font-size: 13px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 1px solid var(--border); }
    td { padding: 14px 20px; font-size: 14px; border-bottom: 1px solid rgba(255,255,255,0.05); }
    tr:last-child td { border-bottom: none; }
    tbody tr { transition: background var(--transition); }
    tbody tr:hover { background: rgba(255,255,255,0.02); }
    tbody tr.selected-row { background: rgba(168,85,247,0.08); }
    .companies-table-container { max-height: calc(100vh - 310px); overflow: auto; }
    .companies-table-container th { position: sticky; top: 0; z-index: 5; box-shadow: 0 1px 0 var(--border); }
    .bulk-action-bar { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; padding: 10px 14px; border: 1px solid var(--border); border-radius: var(--radius-xs); background: var(--nav-active); font-size: 13px; }
    .bulk-action-bar span { margin-right: auto; color: var(--text-heading); font-weight: 600; }
    .row-checkbox { width: 16px; height: 16px; accent-color: var(--accent); cursor: pointer; }
    .monitor-table-container { max-height: calc(100vh - 285px); overflow: auto; }
    .monitor-table-container th { position: sticky; top: 0; z-index: 5; box-shadow: 0 1px 0 var(--border); }
    .step-pill { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 999px; background: rgba(255,255,255,0.05); border: 1px solid var(--border); color: var(--text); font-size: 12px; font-weight: 600; }
    .queue-summary { display: grid; grid-template-columns: repeat(4, minmax(120px, 1fr)); gap: 12px; margin-bottom: 18px; }
    .monitor-toolbar { display: flex; align-items: center; gap: 8px; margin: 12px 0 24px; }

    /* Buttons */
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 10px 18px; border-radius: var(--radius-xs); font-size: 14px; font-weight: 500; cursor: pointer; transition: all var(--transition); border: 1px solid transparent; font-family: var(--font); }
    .btn-primary { background: var(--accent); color: white; box-shadow: 0 4px 12px rgba(168,85,247,0.2); }
    .btn-primary:hover { background: var(--accent-hover); transform: translateY(-1px); box-shadow: 0 6px 16px rgba(168,85,247,0.3); }
    .btn-outline { background: transparent; border-color: var(--border); color: var(--text); }
    .btn-outline:hover { border-color: var(--accent); color: var(--accent); background: var(--nav-active); }
    .btn-danger { background: var(--danger); color: white; box-shadow: 0 4px 12px rgba(239,68,68,0.2); }
    .btn-danger:hover { filter: brightness(1.08); transform: translateY(-1px); }
    .btn-ghost { background: transparent; color: var(--text-muted); padding: 6px 12px; }
    .btn-ghost:hover { color: var(--text); background: rgba(255,255,255,0.05); }
    .btn-sm { padding: 6px 12px; font-size: 13px; }

    /* Forms */
    .form-input, .form-select { width: 100%; background: var(--bg-input); border: 1px solid var(--border); color: var(--text); border-radius: var(--radius-xs); padding: 10px 14px; font-size: 14px; font-family: var(--font); transition: all var(--transition); }
    .form-input:focus, .form-select:focus { outline: none; border-color: var(--border-focus); box-shadow: 0 0 0 3px rgba(168,85,247,0.15); }
    .filter-chip { padding: 6px 16px; border-radius: 20px; border: 1px solid var(--border); background: transparent; color: var(--text-muted); cursor: pointer; transition: all var(--transition); font-size: 13px; font-weight: 500; }
    .filter-chip:hover { border-color: var(--accent); color: var(--text); }
    .filter-chip.active { background: var(--accent); color: white; border-color: var(--accent); box-shadow: 0 4px 12px rgba(168,85,247,0.2); }

    /* Terminals & Code */
    .terminal { background: #000; border-radius: var(--radius-sm); padding: 16px; font-family: var(--font-mono); font-size: 13px; line-height: 1.6; max-height: 400px; overflow-y: auto; border: 1px solid rgba(255,255,255,0.1); }
    .terminal-row { padding: 2px 0; border-bottom: 1px dashed rgba(255,255,255,0.05); display: flex; gap: 12px; }
    .terminal-row:last-child { border-bottom: none; }
    .term-time { color: #64748b; }
    .term-info { color: #3b82f6; }
    .term-success { color: #10b981; }
    .term-error { color: #ef4444; }
    .term-warn { color: #f59e0b; }

    /* Tabs */
    .tabs { display: flex; gap: 8px; border-bottom: 1px solid var(--border); margin-bottom: 24px; }
    .tab { padding: 10px 20px; cursor: pointer; color: var(--text-muted); font-weight: 500; border-bottom: 2px solid transparent; transition: all var(--transition); }
    .tab:hover { color: var(--text); }
    .tab.active { color: var(--accent); border-bottom-color: var(--accent); }

    /* Timeline */
    .timeline { display: flex; align-items: center; justify-content: space-between; position: relative; padding: 20px 0; margin-bottom: 20px;}
    .timeline::before { content: ''; position: absolute; top: 50%; left: 0; right: 0; height: 2px; background: var(--border); transform: translateY(-50%); z-index: 1; }
    .tl-step { position: relative; z-index: 2; background: var(--bg-card); padding: 8px 16px; border-radius: 20px; border: 1px solid var(--border); font-size: 12px; font-weight: 600; color: var(--text-muted); display: flex; align-items: center; gap: 6px; }
    .tl-step.done { border-color: var(--success); color: var(--success); box-shadow: 0 0 10px rgba(16,185,129,0.1); }
    .tl-step.active { border-color: var(--accent); color: var(--accent); box-shadow: 0 0 10px rgba(168,85,247,0.2); }

    /* Utils & Animations */
    .flex { display: flex; } .flex-between { display: flex; justify-content: space-between; align-items: center; } .gap-2 { gap: 16px; } .gap-1 { gap: 8px; } .mb-1 { margin-bottom: 8px; } .mb-2 { margin-bottom: 16px; } .mb-3 { margin-bottom: 24px; } .mt-2 { margin-top: 16px; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
    
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes shimmer { 100% { transform: translateX(100%); } }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }

  </style>
</head>
<body data-theme="glass-neon">

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-brand">
      <div class="logo-box"><i data-lucide="zap"></i></div>
      <div class="brand-title">Pipeline Control</div>
    </div>
    
    <nav class="sidebar-nav">
      <a href="#/dashboard" class="nav-item active" id="nav-dashboard"><i data-lucide="layout-dashboard"></i> Dashboard</a>
      <a href="#/companies" class="nav-item" id="nav-companies"><i data-lucide="building-2"></i> Companies</a>
      <a href="#/runner" class="nav-item" id="nav-runner"><i data-lucide="activity"></i> Monitor Detail</a>
      <div class="nav-divider"></div>
      <a href="#/settings" class="nav-item" id="nav-settings"><i data-lucide="settings"></i> Settings</a>
      <a href="#/logs" class="nav-item" id="nav-logs"><i data-lucide="terminal"></i> Logs</a>
    </nav>

    <div class="sidebar-quota" style="position: relative;">
      <div class="quota-bar">
        <div class="quota-label"><span>Gemini Quota</span> <span id="q-gemini">...</span></div>
        <div class="quota-track"><div class="quota-fill ok" id="qf-gemini" style="width: 0%"></div></div>
      </div>
      <div class="quota-bar">
        <div class="quota-label"><span>Firecrawl Credits</span> <span id="q-firecrawl">...</span></div>
        <div class="quota-track"><div class="quota-fill warn" id="qf-firecrawl" style="width: 0%"></div></div>
      </div>
    </div>
  </aside>

  <!-- Main Area -->
  <main class="main-content">
    <div class="theme-switcher">
      <button class="theme-btn" onclick="setTheme('github-dark')" title="GitHub Dark"><i data-lucide="moon"></i></button>
      <button class="theme-btn active" onclick="setTheme('glass-neon')" title="Glass Neon"><i data-lucide="sparkles"></i></button>
      <button class="theme-btn" onclick="setTheme('light-minimal')" title="Light Minimal"><i data-lucide="sun"></i></button>
    </div>

    <div id="app-root"></div>
  </main>

  <script>
    // Initialize Icons
    lucide.createIcons();

    // =========================================================================
    // THEME LOGIC
    // =========================================================================
    function setTheme(theme) {
      document.body.setAttribute('data-theme', theme);
      document.querySelectorAll('.theme-btn').forEach(b => b.classList.remove('active'));
      document.querySelector(`.theme-btn[onclick="setTheme('${theme}')"]`).classList.add('active');
      // Redraw charts if needed based on theme
      if(location.hash === '#/dashboard' || location.hash === '') renderDashboard();
    }

    // Animate Number Utility
    function animateValue(obj, start, end, duration, isFloat = false) {
      let startTimestamp = null;
      const step = (timestamp) => {
        if (!startTimestamp) startTimestamp = timestamp;
        const progress = Math.min((timestamp - startTimestamp) / duration, 1);
        const current = progress * (end - start) + start;
        obj.innerHTML = isFloat ? current.toFixed(1) : Math.floor(current);
        if (progress < 1) window.requestAnimationFrame(step);
      };
      window.requestAnimationFrame(step);
    }

    // SVG Donut Chart generator
    function generateDonutSVG(data, size = 160) {
      const total = data.reduce((acc, val) => acc + val.value, 0);
      let cumulativePercent = 0;
      
      let paths = '';
      let legend = '';
      
      data.forEach((slice, i) => {
        const percent = slice.value / total;
        const strokeDasharray = `${percent * 100} 100`;
        const strokeDashoffset = `-${cumulativePercent * 100}`;
        
        paths += `<circle r="25" cx="50" cy="50" fill="transparent" 
                  stroke="${slice.color}" stroke-width="15" 
                  stroke-dasharray="${strokeDasharray}" stroke-dashoffset="${strokeDashoffset}"
                  transform="rotate(-90 50 50)" style="transition: all 1s ease" />`;
        
        legend += `<div style="display:flex;align-items:center;gap:8px;font-size:13px;margin-bottom:8px">
                    <span style="width:10px;height:10px;border-radius:50%;background:${slice.color}"></span>
                    <span style="color:var(--text-muted)">${slice.label}</span>
                    <strong style="margin-left:auto">${Math.round(percent*100)}%</strong>
                   </div>`;
                   
        cumulativePercent += percent;
      });

      return `
        <div style="display:flex;align-items:center;gap:32px">
          <svg width="${size}" height="${size}" viewBox="0 0 100 100" style="filter: drop-shadow(0 4px 8px rgba(0,0,0,0.2))">
            ${paths}
            <circle r="17.5" cx="50" cy="50" fill="var(--bg-card)" />
          </svg>

    async function apiFetch(url, options = {}) {
      const resp = await fetch(url, options);
      const data = await resp.json().catch(() => ({}));
      if (!resp.ok) throw new Error(data.error || data.detail || `Request failed: ${resp.status}`);
      return data;
    }

    function showError(message) {
      appRoot.innerHTML = `

            <div class="text-muted mt-1">${message}</div>
          </div>
        </div>
      `;
    }

    function getVisibleCompanyRows() {
      return [...document.querySelectorAll('[data-company-id]')]
        .filter(row => row.style.display !== 'none');
    }

    let companySearchTimer = null;
    function searchCompanies(query) {
      clearTimeout(companySearchTimer);
      companySearchTimer = setTimeout(() => {
        selectedCompanyIds.clear();
        renderCompanies({ search: query.trim(), page: 1 });
      }, 300);
    }

    function toggleCompanySelection(id, checked) {
      checked ? selectedCompanyIds.add(id) : selectedCompanyIds.delete(id);
      updateCompanySelectionUi();
    }

    function toggleAllCompanies(el) {
      getVisibleCompanyRows().forEach(row => {
        const id = Number(row.dataset.companyId);
        el.checked ? selectedCompanyIds.add(id) : selectedCompanyIds.delete(id);
      });
      updateCompanySelectionUi();
    }

    function clearCompanySelection() {
      selectedCompanyIds.clear();
      updateCompanySelectionUi();
    }

    function syncSelectAllCompanies() {
      const selectAll = document.getElementById('selectAllCompanies');
      if (!selectAll) return;

      const visibleRows = getVisibleCompanyRows();
      const selectedVisibleCount = visibleRows.filter(row => selectedCompanyIds.has(Number(row.dataset.companyId))).length;
      selectAll.checked = visibleRows.length > 0 && selectedVisibleCount === visibleRows.length;
      selectAll.indeterminate = selectedVisibleCount > 0 && selectedVisibleCount < visibleRows.length;
    }

    function updateCompanySelectionUi() {
      const count = selectedCompanyIds.size;
      document.querySelectorAll('[data-company-id]').forEach(row => {
        const id = Number(row.dataset.companyId);
        const checked = selectedCompanyIds.has(id);
        row.classList.toggle('selected-row', checked);
        const checkbox = row.querySelector('.company-check');
        if (checkbox) checkbox.checked = checked;
      });

      const bar = document.getElementById('bulkActionBar');
      const runBtn = document.getElementById('runSelectedBtn');
      const countEl = document.getElementById('selectedCompanyCount');
      if (bar) bar.style.display = count > 0 ? 'flex' : 'none';
      if (runBtn) runBtn.style.display = count > 0 ? 'inline-flex' : 'none';
      if (countEl) countEl.textContent = `${count} compan${count === 1 ? 'y' : 'ies'} selected`;
      syncSelectAllCompanies();
    }

    async function runSelectedCompanies() {
      const ids = [...selectedCompanyIds];
      if (!ids.length) return;
      try {
        const result = await apiFetch('/api/spa/runner/start', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({company_ids: ids})
        });
        selectedCompanyIds.clear();
        alert(`Started: ${result.started.length}. Skipped: ${result.skipped.length}.`);
        renderCompanies();
      } catch (err) {
        alert(err.message);
      }
    }

    async function runSingleCompany(id) {
      selectedCompanyIds.clear();
      selectedCompanyIds.add(id);
      await runSelectedCompanies();
    }

    async function importCompaniesFile(file) {
      if (!file) return;
      const text = await file.text();
      const names = text.split(/\r?\n/)
        .map(line => line.split(',')[0].trim())
        .filter(Boolean);
      if (!names.length) {
        alert('No company names found.');
        return;
      }
      try {
        const result = await apiFetch('/api/companies/import', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({names})
        });
        alert(`Imported ${result.imported}; skipped ${result.skipped}.`);
        renderCompanies({page: 1});
      } catch (err) {
        alert(err.message);
      }
    }

  <script>
    // =========================================================================
    // INSPECTOR MODE
    // =========================================================================
    (function() {
      console.log("Inspector Mode script loading...");
      let isInspectorActive = false;
      let highlightedElement = null;

      // Add toggle button
      const toggleBtn = document.createElement('button');
      toggleBtn.innerHTML = '<i data-lucide="mouse-pointer-click"></i> Inspector Mode';
      Object.assign(toggleBtn.style, {
        position: 'fixed', bottom: '20px', right: '20px', zIndex: '10000',
        background: 'var(--accent)', color: 'white', border: 'none',
        padding: '10px 16px', borderRadius: '20px', display: 'flex', gap: '8px',
        alignItems: 'center', cursor: 'pointer', boxShadow: '0 4px 12px rgba(168,85,247,0.3)',
        fontFamily: 'var(--font)', fontWeight: '500', fontSize: '14px', transition: 'background 0.2s'
      });
      document.body.appendChild(toggleBtn);
      if (typeof lucide !== 'undefined') lucide.createIcons();

      // Add overlay outline
      const outline = document.createElement('div');
      Object.assign(outline.style, {
        position: 'fixed', pointerEvents: 'none', zIndex: 9999,
        border: '2px dashed #ef4444', backgroundColor: 'rgba(239, 68, 68, 0.15)',
        transition: 'all 0.05s linear', display: 'none'
      });
      document.body.appendChild(outline);

      // Add modal for copying selector
      const modal = document.createElement('div');
      Object.assign(modal.style, {
        position: 'fixed', top: '50%', left: '50%', transform: 'translate(-50%, -50%)',
        background: 'var(--bg-secondary)', padding: '24px', borderRadius: 'var(--radius)',
        boxShadow: '0 10px 40px rgba(0,0,0,0.5)', zIndex: 10001, display: 'none', border: '1px solid var(--border)',
        width: '400px', maxWidth: '90%', fontFamily: 'var(--font)'
      });
      modal.innerHTML = `
        <h3 style="margin-top:0;margin-bottom:16px;color:var(--text-heading);font-size:16px;display:flex;align-items:center;gap:8px"><i data-lucide="target" style="width:18px"></i> Element Selected</h3>
        <div style="font-family:var(--font-mono);font-size:12px;background:var(--bg-input);padding:12px;border-radius:var(--radius-xs);margin-bottom:16px;word-break:break-all;color:var(--accent);border:1px solid var(--border)" id="ins-selector"></div>
        <textarea id="ins-comment" class="form-input" style="height:80px;margin-bottom:16px;resize:vertical;" placeholder="Gõ yêu cầu của bạn vào đây (vd: Đổi màu nút này thành xanh, chuyển khối này sang trái...)..."></textarea>
        <div style="display:flex;gap:12px;justify-content:flex-end">
          <button class="btn btn-outline" id="ins-cancel">Cancel</button>
          <button class="btn btn-primary" id="ins-copy"><i data-lucide="copy" style="width:16px"></i> Copy to Clipboard</button>
        </div>
      `;
      document.body.appendChild(modal);

      const getSelector = (el) => {
        if (!el || el.tagName.toLowerCase() === 'body') return 'body';
        if (el.id) return '#' + el.id;
        let path = [];
        let current = el;
        while (current && current.nodeType === Node.ELEMENT_NODE && current.tagName.toLowerCase() !== 'body') {
          let sel = current.tagName.toLowerCase();
          if (current.className && typeof current.className === 'string') {
             const classes = current.className.split(' ').filter(c => c && !['active'].includes(c));
             if (classes.length > 0) sel += '.' + classes.join('.');
          }
          path.unshift(sel);
          current = current.parentNode;
        }
        return path.join(' > ');
      };

      const mouseMoveHandler = (e) => {
        if (!isInspectorActive || modal.style.display === 'block') return;
        const target = e.target;
        // Bỏ qua nếu đang trỏ vào Sidebar hoặc chính nút Toggle
        if (target === toggleBtn || target.closest('.sidebar')) {
          outline.style.display = 'none';
          highlightedElement = null;
          return;
        }
        const rect = target.getBoundingClientRect();
        Object.assign(outline.style, {
          display: 'block', top: rect.top + 'px', left: rect.left + 'px',
          width: rect.width + 'px', height: rect.height + 'px'
        });
        highlightedElement = target;
      };

      const clickHandler = (e) => {
        if (!isInspectorActive) return;
        if (e.target === toggleBtn || toggleBtn.contains(e.target) || modal.contains(e.target)) return;
        
        // Ngăn chặn sự kiện click mặc định của trình duyệt để không bị nhảy trang
        e.preventDefault();
        e.stopPropagation();
        
        if (highlightedElement) {
          const selector = getSelector(highlightedElement);
          document.getElementById('ins-selector').innerText = selector;
          document.getElementById('ins-comment').value = '';
          modal.style.display = 'block';
          outline.style.display = 'none';
          setTimeout(() => lucide.createIcons(), 50); // Refresh icon trong modal
        }
      };

      toggleBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        isInspectorActive = !isInspectorActive;
        toggleBtn.style.background = isInspectorActive ? '#ef4444' : 'var(--accent)';
        toggleBtn.innerHTML = isInspectorActive ? '<i data-lucide="x"></i> Stop Inspector' : '<i data-lucide="mouse-pointer-click"></i> Inspector Mode';
        lucide.createIcons();
        if (!isInspectorActive) {
          outline.style.display = 'none';
          highlightedElement = null;
        }
      });

      document.addEventListener('mousemove', mouseMoveHandler);
      // Dùng capture phase (true) để chặn event sớm nhất
      document.addEventListener('click', clickHandler, true);

      document.getElementById('ins-cancel').addEventListener('click', () => {
        modal.style.display = 'none';
      });

      document.getElementById('ins-copy').addEventListener('click', () => {
        const sel = document.getElementById('ins-selector').innerText;
        const cmt = document.getElementById('ins-comment').value;
        const textToCopy = "[UI Element: " + sel + "]\\nComment: " + cmt;
        
        navigator.clipboard.writeText(textToCopy).then(() => {
          modal.style.display = 'none';
          isInspectorActive = false;
          toggleBtn.style.background = 'var(--accent)';
          toggleBtn.innerHTML = '<i data-lucide="mouse-pointer-click"></i> Inspector Mode';
          lucide.createIcons();
          
          // Show toast notification
          const toast = document.createElement('div');
          toast.innerText = 'Copied to clipboard!';
          Object.assign(toast.style, {
            position: 'fixed', bottom: '80px', right: '20px', zIndex: 10000,
            background: 'var(--success)', color: 'white', padding: '10px 20px',
            borderRadius: '20px', fontWeight: '500', boxShadow: 'var(--shadow)',
            opacity: '1', transition: 'opacity 0.5s', fontFamily: 'var(--font)'
          });
          document.body.appendChild(toast);
          setTimeout(() => { toast.style.opacity = '0'; setTimeout(() => toast.remove(), 500); }, 2000);
        });
      });
    })();
  </script>
</body>
