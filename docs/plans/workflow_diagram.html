<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Actual System Pipeline Diagram</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;800&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            margin: 0; padding: 0;
            font-family: 'Inter', 'Noto Sans KR', sans-serif;
            color: #f8fafc;
            background: #020617;
            overflow: hidden;
        }
        
        .layout {
            display: flex;
            height: 100vh;
            width: 100vw;
        }

        /* --- LEFT PANE (DIAGRAM) --- */
        .left-pane {
            flex: 6.5; 
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at center, #1e293b 0%, #020617 100%);
            overflow: hidden;
        }

        .lang-toggle {
            position: absolute;
            top: 40px;
            left: 40px;
            display: flex;
            gap: 12px;
            z-index: 20;
        }
        
        .lang-toggle button {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            color: #94a3b8;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.3s;
            font-family: inherit;
            backdrop-filter: blur(10px);
        }
        
        .lang-toggle button.active {
            background: rgba(56, 189, 248, 0.15);
            border-color: #38bdf8;
            color: #38bdf8;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.2);
        }

        .diagram-canvas {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px; /* Reduced gap to fit 5 nodes */
            width: 100%;
            height: 100%;
            transition: transform 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
            transform-origin: center center;
        }

        /* Arrows */
        .arrow {
            font-size: 20px;
            color: rgba(148, 163, 184, 0.4);
            z-index: 1;
            transition: opacity 0.4s;
        }
        .diagram-canvas.zoomed .arrow {
            opacity: 0.1;
        }

        /* Nodes */
        .node {
            position: relative;
            width: 140px;
            height: 140px;
            background: rgba(30, 41, 59, 0.6);
            backdrop-filter: blur(15px);
            border: 2px solid rgba(148, 163, 184, 0.2);
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            z-index: 2;
        }

        .node .icon {
            font-size: 32px;
            color: #94a3b8;
            margin-bottom: 12px;
            transition: all 0.4s;
        }

        .node .title {
            font-size: 14px;
            font-weight: 700;
            color: #cbd5e1;
            text-align: center;
            padding: 0 10px;
            line-height: 1.4;
        }

        /* Hover Effect */
        .node:hover {
            border-color: #38bdf8;
            background: rgba(30, 41, 59, 0.9);
            box-shadow: 0 15px 35px rgba(56, 189, 248, 0.25);
            transform: translateY(-5px);
        }
        .node:hover .icon {
            color: #38bdf8;
            transform: scale(1.1);
        }

        /* Active State (Zoomed) */
        .node.active {
            border-color: #818cf8;
            background: rgba(30, 41, 59, 1);
            box-shadow: 0 0 50px rgba(129, 140, 248, 0.4);
        }
        .node.active .icon {
            color: #818cf8;
        }

        /* Dimmed State */
        .node.dimmed {
            opacity: 0.4;
            filter: blur(3px);
            transform: scale(0.95);
        }
        .node.dimmed:hover {
            opacity: 0.8;
            filter: blur(0px);
            transform: scale(1);
        }

        /* Tooltip */
        .tooltip {
            position: absolute;
            bottom: calc(100% + 15px);
            left: 50%;
            transform: translateX(-50%) translateY(10px);
            background: rgba(15, 23, 42, 0.95);
            border: 1px solid #38bdf8;
            padding: 12px 16px;
            border-radius: 12px;
            width: 250px;
            color: #f1f5f9;
            font-size: 13px;
            line-height: 1.6;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s;
            pointer-events: none;
            z-index: 10;
        }
        .tooltip::after {
            content: '';
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translateX(-50%);
            border-width: 8px;
            border-style: solid;
            border-color: #38bdf8 transparent transparent transparent;
        }
        .node:hover .tooltip {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) translateY(0);
        }
        .diagram-canvas.zoomed .tooltip {
            display: none !important;
        }

        /* --- RIGHT PANE (SIDEBAR) --- */
        .right-pane {
            flex: 3.5; 
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(20px);
            border-left: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            flex-direction: column;
            padding: 40px;
            box-shadow: -20px 0 50px rgba(0,0,0,0.4);
            position: relative;
            z-index: 10;
            overflow-y: auto;
        }

        .header {
            margin-bottom: 30px;
        }
        .header h1 {
            font-size: 26px;
            font-weight: 800;
            margin: 0 0 10px 0;
            background: linear-gradient(135deg, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1.2;
        }
        .header p {
            color: #94a3b8;
            margin: 0;
            font-size: 14px;
            line-height: 1.5;
        }

        .sidebar-content {
            flex: 1;
            display: none;
            animation: fadeIn 0.5s ease forwards;
        }
        .sidebar-content.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Overview Content */
        .overview-card {
            background: rgba(30, 41, 59, 0.5);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 20px;
            padding: 30px;
            box-shadow: inset 0 2px 10px rgba(0,0,0,0.2);
        }
        .overview-card h2 {
            font-size: 20px;
            margin: 0 0 15px 0;
            color: #f1f5f9;
        }
        .overview-card p {
            color: #cbd5e1;
            line-height: 1.8;
            font-size: 15px;
            white-space: pre-line;
        }

        /* Detail Content */
        .btn-back {
            background: rgba(56, 189, 248, 0.1);
            border: 1px solid rgba(56, 189, 248, 0.3);
            color: #38bdf8;
            padding: 10px 16px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 20px;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            transition: all 0.3s;
            font-family: inherit;
        }
        .btn-back:hover {
            background: rgba(56, 189, 248, 0.25);
            box-shadow: 0 5px 15px rgba(56, 189, 248, 0.15);
            transform: translateX(-5px);
        }

        .detail-card h2 {
            font-size: 26px;
            font-weight: 800;
            margin: 0 0 15px 0;
            color: #f8fafc;
        }

        .mechanics { margin-top: 25px; }
        .mechanics h3 {
            font-size: 16px;
            color: #38bdf8;
            margin: 0 0 15px 0;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .mechanics ul {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .mechanics li {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            background: rgba(30, 41, 59, 0.6);
            padding: 16px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.05);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            transition: transform 0.2s;
        }
        .mechanics li:hover {
            transform: translateX(5px);
            background: rgba(30, 41, 59, 0.8);
            border-color: rgba(56, 189, 248, 0.2);
        }
        .mechanics li i {
            color: #818cf8;
            font-size: 18px;
            margin-top: 2px;
            flex-shrink: 0;
        }
        .mechanics li span {
            color: #e2e8f0;
            font-size: 14.5px;
            line-height: 1.6;
        }

        /* ILLUSTRATION MOCKUPS */
        .illu-box {
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 12px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 13px;
            box-shadow: inset 0 2px 10px rgba(0,0,0,0.3);
            margin-bottom: 20px;
        }
        .mock-header {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(30,41,59,0.8);
            padding: 8px 12px;
            border-radius: 6px;
            color: #f8fafc;
            font-weight: bold;
            border-left: 3px solid #38bdf8;
        }
        .mock-content {
            background: rgba(2,6,23,0.6);
            padding: 10px;
            border-radius: 6px;
            color: #cbd5e1;
            border: 1px solid rgba(255,255,255,0.02);
            line-height: 1.5;
        }
        .mock-arrow {
            text-align: center;
            color: #818cf8;
            font-size: 16px;
        }
        .mock-json {
            color: #38bdf8;
            padding-left: 15px;
        }
        .mock-json .val {
            color: #a3e635; /* string green */
        }
        .mock-highlight {
            background: rgba(251, 191, 36, 0.2);
            color: #fbbf24;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: bold;
        }
        .mock-err {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
            padding: 2px 6px;
            border-radius: 4px;
        }

    </style>
</head>

        let currentLang = 'vn';
        let activeNodeId = null;

        function renderSidebar() {
            const data = langData[currentLang];
            
            document.getElementById('header-title').innerText = data.global.title;
            document.getElementById('header-subtitle').innerText = data.global.subTitle;
            document.getElementById('overview-title').innerText = data.global.overviewTitle;
            document.getElementById('overview-desc').innerText = data.global.overviewDesc;
            document.getElementById('btn-back-text').innerText = data.global.backBtn;
            document.getElementById('mechanics-title').innerText = data.global.mechanicsTitle;
            
            data.nodes.forEach(node => {
                document.getElementById(`node-title-${node.id}`).innerText = node.title;
                document.getElementById(`node-hover-${node.id}`).innerText = node.hover;
            });

            if (activeNodeId !== null) {
                renderNodeDetail(activeNodeId);
            }
        }

        function focusNode(id) {
            if (activeNodeId === id) return;
            activeNodeId = id;
            
            const canvas = document.getElementById('canvas');
            const node = document.getElementById(`node-${id}`);
            
            const cx = node.offsetLeft + node.offsetWidth / 2;
            const cy = node.offsetTop + node.offsetHeight / 2;
            
            const canvasCenterX = canvas.offsetWidth / 2;
            const canvasCenterY = canvas.offsetHeight / 2;
            
            const scale = 1.5;
            const tx = (canvasCenterX - cx) * scale;
            const ty = (canvasCenterY - cy) * scale;
            
            canvas.style.transform = `translate(${tx}px, ${ty}px) scale(${scale})`;
            canvas.classList.add('zoomed');
            
            document.querySelectorAll('.node').forEach(n => {
                n.classList.remove('active', 'dimmed');
                if (n.id === `node-${id}`) {
                    n.classList.add('active');
                } else {
                    n.classList.add('dimmed');
                }
            });
            
            document.getElementById('sidebar-default').classList.remove('active');
            document.getElementById('sidebar-detail').classList.add('active');
            
            renderNodeDetail(id);
        }

        function zoomOut() {
            activeNodeId = null;
            
            const canvas = document.getElementById('canvas');
            canvas.style.transform = `translate(0px, 0px) scale(1)`;
            canvas.classList.remove('zoomed');
            
            document.querySelectorAll('.node').forEach(n => {
                n.classList.remove('active', 'dimmed');
            });
            
            document.getElementById('sidebar-detail').classList.remove('active');
            document.getElementById('sidebar-default').classList.add('active');
        }

        function renderNodeDetail(id) {
            const nodeData = langData[currentLang].nodes.find(n => n.id === id);
            document.getElementById('detail-title').innerText = nodeData.title;
            
            // Inject Illustration
            document.getElementById('illustration-container').innerHTML = nodeIllustrations[id];

            const ul = document.getElementById('detail-mechanics');
            ul.innerHTML = '';
            nodeData.mechanics.forEach(text => {
                const li = document.createElement('li');
                li.innerHTML = `<i class="fas fa-check-circle"></i> <span>${text}</span>`;
                ul.appendChild(li);
            });
        }

        function setLanguage(lang) {
            currentLang = lang;
            document.getElementById('btn-vn').classList.toggle('active', lang === 'vn');
            document.getElementById('btn-kr').classList.toggle('active', lang === 'kr');
            renderSidebar();
        }

        setLanguage('vn');

    </script>
